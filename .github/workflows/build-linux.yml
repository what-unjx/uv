# Linux 构建（fork 定制）。
#
# 阶段 3：为 `x86_64-unknown-linux-musl` 追加 zip 打包（含 `.sha256`）。
#
# 两个目标的定位：
# - `x86_64-unknown-linux-gnu`：在 `ubuntu-24.04` 上原生构建，要求 glibc >= 2.39，
#   仅适用于 Ubuntu 24.04 及更新的发行版；只上传裸二进制，不打 zip。
# - `x86_64-unknown-linux-musl`：全静态，不依赖目标机的 libc，可携带到任意 Linux；
#   打包为 `uv-<version>-x86_64-unknown-linux-musl.zip`（内含 `uv` 与 `uvx` 两个文件）。
#
# zip 在 Linux 侧生成，因此会正确记录可执行权限位，解压后无需 `chmod +x`。
# 归档采用平铺结构（`zip -j`）：解压后即得到同目录下的 `uv` 与 `uvx`，
# 而 `uvx` 会查找同目录的 `uv`（见 `crates/uv/src/bin/uvx.rs`），二者必须放在一起。
#
# musl 目标在 Linux 上只需一个面向 musl 的 C 编译器（`musl-tools` 的 `musl-gcc`）：
# 依赖树里需要 C 工具链的只有 `aws-lc-sys`（C + 汇编，无 C++）与 `zstd-sys`/jemalloc。
# Rust 侧 musl 目标自带 self-contained 链接，无需额外 sysroot。
#
# 触发方式：
# - 推送 `local-mods` 分支且改动命中下方 `paths` 时自动构建；
# - 或 GitHub Actions 页面手动 Run workflow（`workflow_dispatch`）。
#
# 注意：`workflow_dispatch` 要求本文件存在于仓库默认分支（当前为 `main`）。
# 在文件尚未进入 `main` 之前，只能靠 `push` 触发；后续可将文件同步到 `main`，
# 或把仓库默认分支切换为 `local-mods`，以启用手动触发。
name: "Build uv for Ubuntu 24.04"

on:
  workflow_dispatch:
  push:
    branches: [local-mods]
    paths:
      - .github/workflows/build-linux.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 只有 musl 目标需要面向 musl 的 C 编译器。
      - name: "Install musl toolchain"
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zip unzip

      # `rust-toolchain.toml` 固定了工具链版本，rustup 会在首次调用 cargo 时自动安装。
      - name: "Show toolchain"
        run: |
          rustc --version && cargo --version
          rustup target add ${{ matrix.target }}

      # 不追加 `codegen-units = 1`，先以标准 release 配置换取更快的反馈。
      # 与 `build/build-uv.ps1` 的差异：Linux 侧不需要 `self-update`
      # （其下载源硬编码为 astral-sh/uv，见 `crates/uv/src/commands/self_update.rs`）。
      - name: "Build uv"
        env:
          # cc-rs 按目标三元组读取，因此不影响 gnu 目标。
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked -p uv \
            --no-default-features --features performance \
            --target ${{ matrix.target }}

      - name: "Smoke test"
        env:
          # 本 fork 要求配置 UV_HOME（见 `crates/uv-static/src/env_vars.rs`）。
          UV_HOME: ${{ runner.temp }}/uv-home
        run: ./target/${{ matrix.target }}/release/uv --version

      # 阶段 2 的核心验收点：确认 musl 产物是全静态的。
      - name: "Verify static linking"
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file target/${{ matrix.target }}/release/uv
          file target/${{ matrix.target }}/release/uv | grep -qE 'statically linked|static-pie linked'

      # 阶段 4 接入 Release 时，归档名会改为携带 fork 标签（如 `v0.12.5-unjx.N`）。
      - name: "Package zip"
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          UV_HOME: ${{ runner.temp }}/uv-home
        run: |
          set -euo pipefail
          VERSION=$(./target/${{ matrix.target }}/release/uv --version | awk '{print $2}')
          ARCHIVE="uv-${VERSION}-${{ matrix.target }}.zip"
          mkdir -p dist/pkg
          cp target/${{ matrix.target }}/release/uv dist/pkg/
          cp target/${{ matrix.target }}/release/uvx dist/pkg/
          # `-j` 平铺：压缩包内只有 `uv` 与 `uvx` 两个条目（保留可执行权限位）。
          (cd dist/pkg && zip -j "../${ARCHIVE}" uv uvx)
          sha256sum "dist/${ARCHIVE}" > "dist/${ARCHIVE}.sha256"
          echo "--- archive ---"
          unzip -l "dist/${ARCHIVE}"
          echo "--- sha256 ---"
          cat "dist/${ARCHIVE}.sha256"
          # 校验解压后两个文件都带可执行权限位（Linux 侧打包的主要收益）。
          mkdir -p dist/verify
          (cd dist/verify && unzip -q "../${ARCHIVE}" && test -x uv && test -x uvx)
          echo "executable bits preserved"

      - name: "Upload binaries"
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/uv
            target/${{ matrix.target }}/release/uvx
          if-no-files-found: error

      - name: "Upload zip"
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-${{ matrix.target }}-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
