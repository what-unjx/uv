# Linux 构建与发布（fork 定制）。
#
# 阶段 4：仅由 tag 推送触发，构建 `x86_64-unknown-linux-musl` 静态产物，
# 打包为 zip 并创建 GitHub Release（只挂 zip 与 `.sha256`）。
#
# 阶段 5：在解压后的真实发布物上做验收（运行 `uv` 与 `uvx`），
# 并把实际 sha256 写进发布说明。
#
# 命名约定对齐 `FORK.md` 的 Windows 发布流程：
# - tag：`v<上游版本>-unjx.<序号>`，例如 `v0.12.5-unjx.3`
# - 归档：`uv-<tag>-<target>.zip`，例如 `uv-v0.12.5-unjx.3-x86_64-unknown-linux-musl.zip`
#   （Windows 侧对应 `uv-<tag>-x86_64-pc-windows-msvc.7z`）
#
# 为什么只做 musl：产物为 `static-pie` 全静态，不依赖目标机 libc，
# 在 Ubuntu 24.04 与更新的发行版上都能直接运行。gnu 目标此前仅用于验证
# fork 在 Linux 上可编译，其作用已由 musl 构建覆盖，因此不再进入发布链路。
#
# zip 在 Linux 侧生成，因此会正确记录可执行权限位，解压后无需 `chmod +x`。
# 归档采用平铺结构（`zip -j`）：解压后即得到同目录下的 `uv` 与 `uvx`；
# `uvx` 会查找同目录的 `uv`（见 `crates/uv/src/bin/uvx.rs`），二者必须放在一起。
#
# musl 目标在 Linux 上只需一个面向 musl 的 C 编译器（`musl-tools` 的 `musl-gcc`）：
# 依赖树里需要 C 工具链的只有 `aws-lc-sys`（C + 汇编，无 C++）与 `zstd-sys`/jemalloc。
# Rust 侧 musl 目标自带 self-contained 链接，无需额外 sysroot。
#
# 注意：本文件必须已存在于被打 tag 的那个提交上，tag 推送才会触发本 workflow。
name: "Release uv for Ubuntu 24.04 (musl)"

on:
  push:
    tags:
      - 'v*-unjx.*'

# 创建 Release 需要写权限；其余步骤只需要读。
permissions:
  contents: write

jobs:
  linux-musl:
    name: x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-musl
      # cc-rs 按目标三元组读取。
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install musl toolchain"
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zip unzip

      # `rust-toolchain.toml` 固定了工具链版本，rustup 会在首次调用 cargo 时自动安装。
      - name: "Show toolchain"
        run: |
          rustc --version && cargo --version
          rustup target add "${TARGET}"

      # 不追加 `codegen-units = 1`，先以标准 release 配置换取更快的反馈。
      # 与 `build/build-uv.ps1` 的差异：Linux 侧不需要 `self-update`
      # （其下载源硬编码为 astral-sh/uv，见 `crates/uv/src/commands/self_update.rs`）。
      - name: "Build uv"
        run: |
          cargo build --release --locked -p uv \
            --no-default-features --features performance \
            --target "${TARGET}"

      - name: "Smoke test"
        env:
          # 本 fork 要求配置 UV_HOME（见 `crates/uv-static/src/env_vars.rs`）。
          UV_HOME: ${{ runner.temp }}/uv-home
        run: ./target/${TARGET}/release/uv --version

      - name: "Verify static linking"
        run: |
          file target/${TARGET}/release/uv
          file target/${TARGET}/release/uv | grep -qE 'statically linked|static-pie linked'

      - name: "Package zip"
        run: |
          set -euo pipefail
          ARCHIVE="uv-${{ github.ref_name }}-${TARGET}.zip"
          mkdir -p dist/pkg
          cp target/${TARGET}/release/uv dist/pkg/
          cp target/${TARGET}/release/uvx dist/pkg/
          # `-j` 平铺：压缩包内只有 `uv` 与 `uvx` 两个条目（保留可执行权限位）。
          (cd dist/pkg && zip -j "../${ARCHIVE}" uv uvx)
          # 在 dist/ 内计算校验值，使 `.sha256` 里的路径不带 `dist/` 前缀。
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")
          echo "--- archive ---"
          unzip -l "dist/${ARCHIVE}"
          echo "--- sha256 ---"
          cat "dist/${ARCHIVE}.sha256"
          # 校验解压后两个文件都带可执行权限位（Linux 侧打包的主要收益）。
          mkdir -p dist/verify
          (cd dist/verify && unzip -q "../${ARCHIVE}" && test -x uv && test -x uvx)
          echo "executable bits preserved"

      # 阶段 5：在解压出来的**真实发布物**上验收，而不是只验证 `target/` 下的编译产物。
      # `uvx` 会查找同目录的 `uv`（见 `crates/uv/src/bin/uvx.rs`），因此这一步同时验证了
      # 归档布局（平铺、两文件同目录）、可执行权限位，以及二进制能脱离构建目录运行。
      - name: "Verify extracted artifacts"
        env:
          UV_HOME: ${{ runner.temp }}/uv-home
        run: |
          set -euo pipefail
          cd dist/verify
          ls -l uv uvx
          ./uv --version
          ./uvx --version
          echo "extracted artifacts OK"

      - name: "Upload zip"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-x86_64-unknown-linux-musl-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - name: "Create GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # 发布说明写入文件，避免在多行字符串里处理引号。
          printf '%s\n' \
            'Linux 静态构建（musl），适用于 Ubuntu 24.04 及更新的发行版。' \
            '' \
            '- 目标三元组：`x86_64-unknown-linux-musl`（`static-pie`，不依赖目标机 libc）' \
            '- 归档内容：`uv` 与 `uvx`（平铺，解压后自带可执行权限；`uvx` 需与 `uv` 同目录）' \
            '' \
            '校验：`sha256sum -c uv-'"${TAG}"'-x86_64-unknown-linux-musl.zip.sha256`' \
            > dist/notes.md

          # 把实际校验值也写进发布说明，便于不开终端也能核对。
          {
            printf '\n```\n'
            cat dist/uv-*.zip.sha256
            printf '```\n'
          } >> dist/notes.md

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            # 重新运行同一 tag（例如从 UI 重跑）时，覆盖已有资产。
            gh release upload "${TAG}" dist/*.zip dist/*.zip.sha256 \
              --repo "${REPO}" --clobber
          else
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "uv ${TAG}" \
              --latest \
              --verify-tag \
              --notes-file dist/notes.md \
              dist/*.zip dist/*.zip.sha256
          fi
